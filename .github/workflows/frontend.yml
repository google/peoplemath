name: Frontend build

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: npm ci
        run: npm ci 2>&1 | perl -lpe 'push(@ds, $1) if /deprecated\s+(@?[^:\s]+):/; END { for $d (@ds) { print "Import path of deprecated $d:"; system("npm", "list", $d, "--depth=20") == 0 or die "$!" } }'
        shell: bash
      - name: ng lint
        run: npx ng lint
      - name: ng test
        run: npx ng test --no-watch --no-progress --browsers ChromeHeadless
      - name: Prettier check
        run: npx prettier --check .
      - name: Prod build
        run: bash build_appengine.sh
      - name: List appengine_dist
        run: ls -lhR appengine_dist
