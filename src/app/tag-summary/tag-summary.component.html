<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Work tagged {{tag}}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <ul>
      @for (objective of taggedObjectives(); track objective) {
        <li>
          <app-objective-summary [objective]="objective" [unit]="$safeNavigationMigration(period?.unit)">
          </app-objective-summary>
        </li>
      }
      <li><b>Total:</b> <app-resource-quantity
      [quantity]="totalAllocationsForTag()"
      [primaryUnit]="$safeNavigationMigration(period?.unit)"
      [secondaryUnits]="$safeNavigationMigration(period?.secondaryUnits)"
    [fraction]="allocationsFractionForTag()"></app-resource-quantity></li>
  </ul>
</mat-card-content>
</mat-card>
